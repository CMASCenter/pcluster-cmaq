Region: us-east-1
Image:
  Os: ubuntu2404
HeadNode:
  InstanceType: c7g.large
  Networking:
    SubnetId: subnet-0dba51d6958a00750
  DisableSimultaneousMultithreading: true
  Ssh:
    KeyName: cmas_ed25519_key
  CustomActions:
    OnNodeConfigured:
      Script: s3://cost-alloc-tag-pcluster/post_install.sh
  Iam:
    S3Access:
      - BucketName: cost-alloc-tag-pcluster 
        EnableWriteAccess: False
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::440858712842:policy/pclusterTagsAndBudget
  LocalStorage:
    RootVolume:
      Encrypted: false
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    ScaledownIdletime: 5
  SlurmQueues:
    - Name: queue1
      CapacityType: ONDEMAND
      Networking:
        SubnetIds:
          - subnet-0dba51d6958a00750
        PlacementGroup:
          Enabled: true
      ComputeResources:
        - Name: hpc7g4xlarge
          InstanceType: hpc7g.4xlarge
          MinCount: 0
          MaxCount: 4
          DisableSimultaneousMultithreading: true
          Efa:
            Enabled: true
            GdrSupport: false
      CustomActions:
        OnNodeConfigured:
          Script: s3://cost-alloc-tag-pcluster/post_install.sh
      Iam:
        S3Access:
          - BucketName: cost-alloc-tag-pcluster 
            EnableWriteAccess: False
        AdditionalIamPolicies:
          - Policy: arn:aws:iam::440858712842:policy/pclusterTagsAndBudget
SharedStorage:
  - MountDir: /shared
    Name: ebs-shared
    StorageType: Ebs
    EbsSettings:
      Encrypted: false
      SnapshotId: snap-0049a7c309f238500
  - Name: FsxLustre0
    StorageType: FsxLustre
    MountDir: /fsx
    FsxLustreSettings:
      DeletionPolicy: Delete
      StorageCapacity: 1200
      DeploymentType: SCRATCH_2
      DataCompressionType: LZ4
      ImportPath: s3://cmas-cmaq
Tags:
  - Key: aws-parallelcluster-username
    Value: ubuntu
  - Key: aws-parallelcluster-jobid
    Value: listos.hpc7g.4xlarge
  - Key: aws-parallelcluster-project
    Value: CMASOPS
