Region: us-east-1
Image:
  Os: ubuntu2204
HeadNode:
  InstanceType: c7g.large
  Networking:
    SubnetId: subnet-03a533b72486e9572 
  Ssh:
    KeyName: cmas_ed25519_key
Scheduling:
  Scheduler: slurm
  SlurmQueues:
    - Name: queue1
      ComputeResources:
      - Name: hpc7g16xlarge
        Instances:
        - InstanceType: hpc7g.16xlarge
        MinCount: 0
        MaxCount: 10
        Efa:
          Enabled: true
      Networking:
        PlacementGroup:
          Enabled: true
        SubnetIds:
        - subnet-03a533b72486e9572
SharedStorage:
  - MountDir: /shared
    Name: ebs-shared
    StorageType: Ebs
    EbsSettings:
      Encrypted: false
      SnapshotId: snap-0049a7c309f238500
  - Name: FsxLustre0
    StorageType: FsxLustre
    MountDir: /fsx
    FsxLustreSettings:
      DeletionPolicy: Delete 
      StorageCapacity: 1200
      DeploymentType: PERSISTENT_2
      PerUnitStorageThroughput: 125
      DataCompressionType: LZ4
      ImportPath: s3://cmas-cmaq
