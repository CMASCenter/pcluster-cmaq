Region: us-east-1
Image:
  Os: ubuntu2404
HeadNode:
  InstanceType: c7g.large
  Networking:
    SubnetId: subnet-0dba51d6958a00750
  Ssh:
    KeyName: cmas_ed25519_key
Scheduling:
  Scheduler: slurm
  SlurmQueues:
  - Name: queue1
    ComputeResources:
    - Name: hpc7g4xlarge
      Instances:
      - InstanceType: hpc7g.4xlarge
      MinCount: 0
      MaxCount: 10
      Efa:
        Enabled: true
    Networking:
      PlacementGroup:
        Enabled: true
      SubnetIds:
      - subnet-0dba51d6958a00750
SharedStorage:
  - MountDir: /shared
    Name: ebs-shared
    StorageType: Ebs
    EbsSettings:
      Encrypted: false
      SnapshotId: snap-0049a7c309f238500
  - Name: FsxLustre0
    StorageType: FsxLustre
    MountDir: /fsx
    FsxLustreSettings:
      DeletionPolicy: Delete
      StorageCapacity: 1200
      DeploymentType: SCRATCH_2
      DataCompressionType: LZ4
      ImportPath: s3://cmas-cmaq
Tags:
  - Key: aws-parallelcluster-username
    Value: lizadams
  - Key: aws-parallelcluster-jobid
    Value: listos.hpc7g.4xlarge.retry
  - Key: aws-parallelcluster-project
    Value: CMASOPS
